name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "features/**"
      - "crates/**"
      - ".cargo/**"
      - "Cargo.*"
      - ".rustfmt.toml"
      - "README.md"
      - ".github/workflows/ci.yml"
      - "scripts/build-softhsm.sh"
      - "scripts/smoke-softhsm.sh"
      - "scripts/softhsm.env"
      - "Dockerfile"

permissions:
  contents: read

env:
  # We use environment variables to specify the Rust version and other settings once
  RUST_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # SoftHSM 2.7.0 is built from source. The Ubuntu package (2.6.1) has no
      # CKM_ECDSA_SHA256. The build is cached, and a smoke test checks it.
      - name: Set SoftHSM variables
        run: |
          . scripts/softhsm.env
          prefix="$HOME/softhsm"
          {
            echo "SOFTHSM_PREFIX=$prefix"
            echo "PKCS11_MODULE=$prefix/lib/softhsm/libsofthsm2.so"
            echo "SOFTHSM_CACHE_KEY=softhsm-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${SOFTHSM_VERSION}-${{ hashFiles('scripts/softhsm.env', 'scripts/build-softhsm.sh') }}-v1"
          } >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Restore SoftHSM cache
        id: softhsm-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/softhsm
          key: ${{ env.SOFTHSM_CACHE_KEY }}

      - name: Build SoftHSM
        if: steps.softhsm-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ca-certificates curl libssl-dev libtool pkg-config
          sh scripts/build-softhsm.sh "$SOFTHSM_PREFIX"

      - name: Smoke test SoftHSM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends opensc
          sh scripts/smoke-softhsm.sh

      - name: Save SoftHSM cache
        if: steps.softhsm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/softhsm
          key: ${{ env.SOFTHSM_CACHE_KEY }}

      - name: Run tests
        env:
          AES_KEY_LABEL: example-aes
        # CI runs the unit tests only (`--bins`). The integration tests in `tests/`
        # need a token and keys from `setup.sh`, which CI does not make yet.
        run: cargo test --bins
