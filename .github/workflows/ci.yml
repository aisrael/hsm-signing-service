name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "features/**"
      - "crates/**"
      - ".cargo/**"
      - "Cargo.*"
      - ".rustfmt.toml"
      - "README.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  # We use environment variables to specify the Rust version and other settings once
  RUST_TOOLCHAIN: 1.99.0
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install SoftHSM
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2

      - name: Run tests
        env:
          PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        # These tests sign with CKM_ECDSA_SHA256. The SoftHSM in Ubuntu (2.6.1)
        # does not support it (added in 2.7.0). Remove the skips when CI has 2.7.0.
        run: |
          cargo test --workspace -- \
            --skip sign_returns_a_valid_der_signature_for_an_existing_key \
            --skip verify_accepts_a_signature_from_sign \
            --skip verify_fails_for_an_aes_key_label \
            --skip verify_fails_for_an_unknown_label \
            --skip verify_rejects_a_changed_signature \
            --skip verify_rejects_a_signature_from_another_key \
            --skip verify_rejects_another_payload \
            --skip wrap_returns_the_target_key_in_a_form_the_hsm_can_unwrap
